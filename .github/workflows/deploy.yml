name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app-name: dsdd-payments-functions
            app-path: DSDD.Automations.Payments
          - app-name: dsdd-members-functions
            app-path: DSDD.Automations.Members
          - app-name: dsdd-reports-functions
            app-path: DSDD.Automations.Reports
          - app-name: dsdd-discordmessages-functions
            app-path: DSDD.Automations.DiscordMessages
    steps:
      - uses: actions/checkout@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: |
          pushd './${{ matrix.app-path }}'
          dotnet build --configuration Release --output ./output
          popd
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ matrix.app-name }}
          package: '${{ matrix.app-path }}/output'
